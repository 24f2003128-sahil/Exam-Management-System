
{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Edit My Profile</h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ student.name }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                value="{{ student.email }}"
                                readonly
                            >

                            <small class="text-muted">
                                Email address cannot be changed.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ student.phone or '' }}"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Age
                            </label>

                            <input
                                type="number"
                                name="age"
                                class="form-control"
                                min="1"
                                max="100"
                                value="{{ student.age if student.age else '' }}"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                value="{{ student.department or '' }}"
                            >
                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('student_dashboard') }}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-success">
                                Save Changes
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
