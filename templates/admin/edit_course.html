
{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <h1 class="mb-4">Edit Course</h1>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Course Code</label>
                <input type="text"
                       name="course_code"
                       class="form-control"
                       maxlength="20"
                       value="{{ course.course_code }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text"
                       name="course_name"
                       class="form-control"
                       maxlength="100"
                       value="{{ course.course_name }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4">{{ course.description or "" }}</textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Save Changes
            </button>

            <a href="{{ url_for('admin_courses') }}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
