
{% extends "base.html" %}

{% block content %}
<div class="container mt-4 mb-5">
    <h2>Edit Exam Slot #{{ slot.id }}</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Examination</label>
            <select name="examination_id" class="form-select" required>
                {% for exam in examinations %}
                <option value="{{ exam.id }}"
                    {% if exam.id == slot.examination_id %}selected{% endif %}>
                    {{ exam.name }} — {{ exam.course.course_code }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Examiner</label>
            <select name="examiner_id" class="form-select" required>
                {% for examiner in examiners %}
                <option value="{{ examiner.id }}"
                    {% if examiner.id == slot.examiner_id %}selected{% endif %}>
                    {{ examiner.name }} — {{ examiner.department }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-control"
                   value="{{ slot.date.strftime('%Y-%m-%d') }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Time</label>
            <input type="time" name="start_time" class="form-control"
                   value="{{ slot.start_time.strftime('%H:%M') }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">End Time</label>
            <input type="time" name="end_time" class="form-control"
                   value="{{ slot.end_time.strftime('%H:%M') }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacity</label>
            <input type="number" name="capacity" class="form-control"
                   min="1" value="{{ slot.capacity }}" required>
            <small class="text-muted">
                Currently available seats: {{ slot.available_seats }}
            </small>
        </div>

        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{{ url_for('admin_exam_slots') }}"
           class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
