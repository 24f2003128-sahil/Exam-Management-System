
{% extends "base.html" %}

{% block title %}Create Course{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <h1 class="mb-4">Create Course</h1>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Course Code</label>
                <input type="text"
                       name="course_code"
                       class="form-control"
                       maxlength="20"
                       placeholder="Example: DS101"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text"
                       name="course_name"
                       class="form-control"
                       maxlength="100"
                       placeholder="Example: Data Science"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4"></textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Create Course
            </button>

            <a href="{{ url_for('admin_courses') }}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
